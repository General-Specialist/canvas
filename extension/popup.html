<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Jarvis Focus</title>
  <style>
    :root {
      --bg: #181818;
      --card: #222222;
      --border: #333333;
      --text: #f3f4f6;
      --muted: #9ca3af;
      --green: #58cc02;
      --blue: #1cb0f6;
      --red: #ff4b4b;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 260px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 14px;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }
    .title {
      font-size: 13px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--green);
    }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px;
      margin-bottom: 10px;
      font-size: 12px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .row {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .label { color: var(--muted); }
    .val { font-weight: 600; }
    .tag {
      font-size: 10px;
      font-weight: 700;
      color: #fff;
      background: var(--green);
      padding: 1px 6px;
      border-radius: 4px;
    }
    .btn-group {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
    }
    button {
      padding: 7px 10px;
      border-radius: 8px;
      font-size: 11px;
      font-weight: 600;
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--text);
      cursor: pointer;
      transition: all 0.15s;
    }
    button:hover {
      background: #2a2a2a;
      border-color: var(--muted);
    }
    .btn-toggle {
      width: 100%;
      margin-top: 6px;
      background: rgba(88, 204, 2, 0.15);
      border-color: rgba(88, 204, 2, 0.3);
      color: var(--green);
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="title">
      <div class="status-dot" id="dot"></div>
      Jarvis Focus
    </div>
    <span class="tag" id="tagPill">#Coding</span>
  </div>

  <div class="card">
    <div class="row">
      <span class="label">Timer</span>
      <span class="val" id="timerVal">Stopped</span>
    </div>
    <div class="row">
      <span class="label">Mode</span>
      <span class="val" id="modeVal">Unlock on Timer</span>
    </div>
    <div class="row">
      <span class="label">Blocked Sites</span>
      <span class="val" id="countVal">9 sites</span>
    </div>
  </div>

  <div class="btn-group">
    <button id="btn5m">+5m Break</button>
    <button id="btn15m">+15m Break</button>
  </div>

  <button class="btn-toggle" id="btnToggle">Toggle Blocker</button>

  <script src="popup.js"></script>
</body>
</html>
