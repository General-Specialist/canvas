<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Jarvis Focus Blocker</title>
  <style>
    :root {
      --bg: #141414;
      --card: #1f1f1f;
      --border: #2e2e2e;
      --text: #f3f4f6;
      --muted: #9ca3af;
      --green: #58cc02;
      --red: #ff4b4b;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 250px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 14px;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }
    .title {
      font-size: 13px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 7px;
    }
    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--green);
    }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 12px;
      margin-bottom: 10px;
      font-size: 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .row {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .label { color: var(--muted); }
    .val { font-weight: 600; }
    .unblocked-list {
      display: flex;
      flex-direction: column;
      gap: 4px;
      padding-top: 4px;
      border-top: 1px solid var(--border);
    }
    .unblocked-item {
      font-size: 11px;
      color: var(--green);
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .footer-note {
      font-size: 11px;
      color: var(--muted);
      text-align: center;
      line-height: 1.4;
      padding-top: 4px;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="title">
      <div class="status-dot" id="dot"></div>
      Jarvis Focus Blocker
    </div>
  </div>

  <div class="card">
    <div class="row">
      <span class="label">Status</span>
      <span class="val" id="statusVal" style="color: var(--red);">Locked</span>
    </div>
    <div class="row">
      <span class="label">Blocked Websites</span>
      <span class="val" id="countVal">0</span>
    </div>
    <div class="unblocked-list" id="unblockedSection" style="display: none;">
      <span class="label" style="font-size: 10px; text-transform: uppercase;">Active Unblocks:</span>
      <div id="unblockedItems"></div>
    </div>
  </div>

  <p class="footer-note">
    Unblock &amp; manage websites directly from the Jarvis app.
  </p>

  <script src="popup.js"></script>
</body>
</html>
